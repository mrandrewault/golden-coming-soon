<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Golden</title>
<meta name="description" content="Caring for aging family members is about to get a whole lot easier. Golden. Coming soon, starting in Arizona.">
<style>
  :root{
    --foliage:#0a350d;
    --green:#a3e96c;
    --green-deep:#2e6b2f;
    --warm:#fefdf9;
    --linen:#fbf3e8;
    --ink:#1a1a1a;
    --muted:#6b6455;
    --line:#e4dcc9;
    --display: "PP Editorial New", Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: "SF Mono", ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--warm);color:var(--ink);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;min-height:100%;
    background-image:radial-gradient(120% 90% at 50% 0%, #ffffff 0%, var(--warm) 42%, var(--linen) 100%);
  }
  .wrap{max-width:1000px;margin:0 auto;padding:0 28px;width:100%}

  header{padding:30px 0 0}
  .wordmark{font-family:var(--sans);font-weight:800;font-size:22px;letter-spacing:-0.4px;color:var(--foliage)}
  .wordmark .e{color:var(--green-deep)}

  main{flex:1 1 auto;display:flex;align-items:center}
  .hero{padding:40px 0 56px;max-width:760px}
  h1{
    font-family:var(--display);font-weight:700;color:var(--foliage);
    font-size:clamp(33px, 4.7vw, 52px);line-height:1.1;letter-spacing:-0.4px;
    margin:0;
  }
  .status{
    margin:32px 0 0;font-family:var(--sans);font-size:clamp(15px,1.7vw,17px);color:var(--muted);
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  }
  .status .dot{width:9px;height:9px;border-radius:50%;background:var(--green);flex:0 0 auto;
    box-shadow:0 0 0 4px rgba(163,233,108,.28)}
  .status b{color:var(--foliage);font-weight:700}

  .notify{margin:34px 0 0;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .notify a{
    display:inline-block;background:var(--foliage);color:var(--warm);text-decoration:none;
    font-family:var(--sans);font-weight:700;font-size:15px;padding:13px 22px;border-radius:999px;
    transition:transform .12s ease, background .12s ease;
  }
  .notify a:hover{background:#0d420f;transform:translateY(-1px)}
  .notify span{font-size:14px;color:var(--muted)}

  footer{padding:22px 0 26px;border-top:1px solid var(--line)}
  .foot{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
  .foot .safe{font-size:13px;color:var(--muted)}
  .foot .safe a{color:var(--green-deep);text-decoration:none;font-weight:600}
  .foot .mark{font-family:var(--mono);font-size:11px;letter-spacing:1px;color:var(--muted)}

  @media (max-width:560px){
    .hero{padding:26px 0 40px}
    footer{padding:18px 0 22px}
    .foot{justify-content:flex-start}
  }
</style>
</head>
<body>
  <header>
    <div class="wrap">
      <div class="wordmark">gold<span class="e">e</span>n</div>
    </div>
  </header>

  <main>
    <div class="wrap">
      <div class="hero">
        <h1>Caring for aging family members is about to get a whole lot easier.</h1>
        <div class="status"><span class="dot"></span><span><b>Golden.</b> Coming soon, starting in Arizona.</span></div>
        <div class="notify">
          <a href="mailto:hello@golden.healthcare?subject=Tell%20me%20when%20Golden%20opens&body=Please%20let%20me%20know%20when%20Golden%20is%20open.">Get a note when we open</a>
          <span>or write to us at hello@golden.healthcare</span>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="wrap">
      <div class="foot">
        <div class="safe">Golden is not a medical or emergency service. In an emergency, dial <a href="tel:911">911</a>.</div>
        <div class="mark">golden.healthcare</div>
      </div>
    </div>
  </footer>
</body>
</html>
